<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Soundwave Bars & Microphone -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Waveform bars -->
    <rect x="-140" y="-40" width="20" height="80" rx="10" fill="url(#gold)" opacity="0.6" />
    <rect x="-105" y="-80" width="20" height="160" rx="10" fill="url(#gold)" opacity="0.8" />
    <rect x="-70" y="-120" width="20" height="240" rx="10" fill="url(#gold)" />
    <rect x="-35" y="-60" width="20" height="120" rx="10" fill="url(#gold)" opacity="0.9" />
    <rect x="0" y="-140" width="20" height="280" rx="10" fill="url(#gold)" />
    <rect x="35" y="-90" width="20" height="180" rx="10" fill="url(#gold)" opacity="0.9" />
    <rect x="70" y="-110" width="20" height="220" rx="10" fill="url(#gold)" />
    <rect x="105" y="-60" width="20" height="120" rx="10" fill="url(#gold)" opacity="0.8" />
    <rect x="140" y="-30" width="20" height="60" rx="10" fill="url(#gold)" opacity="0.6" />
  </g>
</svg>
